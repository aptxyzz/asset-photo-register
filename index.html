<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14532d"><link rel="manifest" href="manifest.webmanifest"><title>Asset Photo Register</title>
<style>
:root{--g:#14532d;--g2:#16a34a;--bg:#f6f8f7;--card:#fff;--text:#17201b;--muted:#647067;--line:#d5ddd7;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:14px 16px;box-shadow:0 2px 8px #0002}header h1{font-size:19px;margin:0}header p{font-size:12px;margin:3px 0 0;opacity:.85}main{max-width:760px;margin:auto;padding:14px 14px 90px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000b}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar .full{grid-column:1/-1}button,.fileLabel{min-height:46px;border:0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.primary{background:var(--g2);color:#fff}.secondary{background:#e8f5ec;color:#114d27;border:1px solid #b8ddc3}.neutral{background:#edf1ee;color:#26332a;border:1px solid var(--line)}.danger{background:#fff0ef;color:var(--danger);border:1px solid #f1b6b2}.fileLabel input{display:none}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}.stats{display:flex;gap:12px;margin-top:10px;color:var(--muted);font-size:13px}.asset{background:#fff;border:1px solid var(--line);border-radius:13px;margin:9px 0;overflow:hidden}.assetTop{padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.group{font-size:12px;color:var(--g2);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.name{font-size:16px;font-weight:750;margin-top:2px}.count{font-size:12px;color:var(--muted);margin-top:4px}.camera{background:var(--g);color:#fff;width:52px;padding:8px}.photos{display:flex;gap:8px;overflow:auto;padding:0 12px 12px}.thumb{position:relative;min-width:84px;width:84px}.thumb img{width:84px;height:84px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.thumb small{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.del{position:absolute;right:2px;top:2px;width:24px;height:24px;min-height:0;padding:0;border-radius:50%;background:#000a;color:#fff}.empty{text-align:center;color:var(--muted);padding:35px 15px}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 0}.status{position:fixed;left:12px;right:12px;bottom:12px;max-width:736px;margin:auto;background:#15251a;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:10;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:20}.sheet{background:#fff;border-radius:18px 18px 0 0;padding:18px;width:100%;max-height:85vh;overflow:auto}.sheet h2{margin:0 0 6px;font-size:19px}.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:5px 0 10px;font-size:16px}.sheetActions{display:flex;gap:8px}.sheetActions>*{flex:1}@media(min-width:650px){.modal{align-items:center}.sheet{max-width:520px;margin:auto;border-radius:18px}.toolbar{grid-template-columns:repeat(4,1fr)}.toolbar .full{grid-column:auto}}
</style></head><body><header><h1>Asset Photo Register</h1><p>Offline capture • automatic filenames • ZIP export</p></header><main>
<section class="panel"><div class="toolbar">
<label class="fileLabel primary">Import CSV<input id="csvInput" type="file" accept=".csv,text/csv"></label>
<button id="templateBtn" class="secondary">Download template</button>
<button id="exportBtn" class="secondary">Export register + ZIP</button>
<button id="clearBtn" class="danger">Clear all data</button>
</div><p class="hint">CSV headers must be exactly <b>Component Group</b> and <b>Component Name</b>. Export creates one ZIP containing <b>Photo_Register.csv</b> and photos arranged in component folders.</p></section>
<section class="panel"><input id="search" class="search" placeholder="Search component group or name…"><div class="stats"><span id="assetStat">0 assets</span><span id="photoStat">0 photos</span></div></section>
<div id="list"></div></main><div id="status" class="status" aria-live="polite"></div>
<div id="captureModal" class="modal"><div class="sheet"><h2 id="modalTitle">Take photo</h2><p class="hint" id="modalSubtitle"></p><label>Photo description (optional)</label><input id="caption" placeholder="e.g., Overall, defect, connection"><label>Photo source</label><div class="sheetActions"><label class="fileLabel primary">Open camera<input id="cameraInput" type="file" accept="image/*" capture="environment" multiple></label><label class="fileLabel secondary">Choose photos<input id="galleryInput" type="file" accept="image/*" multiple></label></div><div class="sheetActions" style="margin-top:10px"><button id="closeModal" class="neutral">Cancel</button></div></div></div>
<script>
const DB='asset-photo-register-v1', VER=1; let db, selectedAsset=null;
const $=q=>document.querySelector(q), list=$('#list'), statusEl=$('#status');
function msg(t){statusEl.textContent=t;statusEl.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>statusEl.style.display='none',3200)}
function clean(s){return String(s||'').trim()} function safe(s){return clean(s).replace(/[\\/:*?"<>|#%{}~&]/g,'_').replace(/\s+/g,' ').slice(0,80)||'Unnamed'}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(q&&c==='"'&&n==='"'){cell+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'id'});if(!d.objectStoreNames.contains('photos')){let s=d.createObjectStore('photos',{keyPath:'id'});s.createIndex('assetId','assetId')}};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(store,id){return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearStore(store){return new Promise((res,rej)=>{let r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function render(){let assets=await all('assets'),photos=await all('photos'),term=clean($('#search').value).toLowerCase();assets.sort((a,b)=>(a.group+' '+a.name).localeCompare(b.group+' '+b.name));let filtered=assets.filter(a=>(a.group+' '+a.name).toLowerCase().includes(term));$('#assetStat').textContent=`${assets.length} assets`;$('#photoStat').textContent=`${photos.length} photos`;list.innerHTML='';if(!assets.length){list.innerHTML='<div class="empty">Import your two-column CSV to begin.</div>';return}if(!filtered.length){list.innerHTML='<div class="empty">No matching assets.</div>';return}for(const a of filtered){let ps=photos.filter(p=>p.assetId===a.id).sort((x,y)=>x.created-y.created),el=document.createElement('div');el.className='asset';el.innerHTML=`<div class="assetTop"><div><div class="group"></div><div class="name"></div><div class="count">${ps.length} photo${ps.length===1?'':'s'}</div></div><button class="camera" aria-label="Take photos">📷</button></div><div class="photos"></div>`;el.querySelector('.group').textContent=a.group;el.querySelector('.name').textContent=a.name;el.querySelector('.camera').onclick=()=>openCapture(a);let strip=el.querySelector('.photos');for(const p of ps){let u=URL.createObjectURL(p.blob),th=document.createElement('div');th.className='thumb';th.innerHTML=`<img><button class="del" title="Delete">×</button><small></small>`;th.querySelector('img').src=u;th.querySelector('img').onclick=()=>window.open(u,'_blank');th.querySelector('small').textContent=p.filename;th.querySelector('.del').onclick=async()=>{if(confirm('Delete '+p.filename+'?')){await del('photos',p.id);render()}};strip.appendChild(th)}list.appendChild(el)}}
function openCapture(a){selectedAsset=a;$('#modalTitle').textContent='Add photos';$('#modalSubtitle').textContent=a.group+' — '+a.name;$('#caption').value='';$('#captureModal').style.display='flex'}
async function importCSV(file){let rows=parseCSV(await file.text());if(rows.length<2)throw Error('CSV has no asset rows.');let h=rows[0].map(x=>clean(x).toLowerCase()),gi=h.indexOf('component group'),ni=h.indexOf('component name');if(gi<0||ni<0)throw Error('Headers must be Component Group and Component Name.');let count=0;for(let i=1;i<rows.length;i++){let group=clean(rows[i][gi]),name=clean(rows[i][ni]);if(!group&&!name)continue;let id='A'+String(i).padStart(5,'0')+'_'+hash(group+'|'+name);await put('assets',{id,group,name});count++}msg(`Imported ${count} assets`);render()}
function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
async function saveFiles(files){if(!selectedAsset||!files.length)return;let existing=(await all('photos')).filter(p=>p.assetId===selectedAsset.id),seq=existing.length;for(const f of files){seq++;let ext=(f.type.split('/')[1]||'jpg').replace('jpeg','jpg'),base=safe(selectedAsset.group)+'_'+safe(selectedAsset.name),filename=`${base}_${String(seq).padStart(3,'0')}.${ext}`;await put('photos',{id:crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+seq,assetId:selectedAsset.id,filename,caption:clean($('#caption').value),created:Date.now()+seq,blob:f})}$('#captureModal').style.display='none';$('#cameraInput').value='';$('#galleryInput').value='';msg(`Saved ${files.length} photo${files.length===1?'':'s'}`);render()}
function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}function join(parts){let n=parts.reduce((s,p)=>s+p.length,0),o=new Uint8Array(n),x=0;for(let p of parts){o.set(p,x);x+=p.length}return o}function crc32(bytes){let c=0xffffffff;for(let b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
async function makeZip(files){let enc=new TextEncoder(),locals=[],centrals=[],offset=0;for(const f of files){let name=enc.encode(f.name),data=new Uint8Array(await f.blob.arrayBuffer()),crc=crc32(data),local=join([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);let central=join([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);centrals.push(central);offset+=local.length}let central=join(centrals),end=join([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(central.length),u32(offset),u16(0)]);return new Blob([...locals,central,end],{type:'application/zip'})}
async function exportAll(){let assets=await all('assets'),photos=await all('photos');if(!assets.length)return msg('Import assets first.');let map=Object.fromEntries(assets.map(a=>[a.id,a]));let csv=['Component Group,Component Name,Photo Filename,Photo Description,Date Taken'];let files=[];photos.sort((a,b)=>a.created-b.created).forEach(p=>{let a=map[p.assetId]||{group:'Unknown',name:'Unknown'},d=new Date(p.created).toISOString();csv.push([a.group,a.name,p.filename,p.caption,d].map(csvCell).join(','));files.push({name:`Photos/${safe(a.group)}/${safe(a.name)}/${p.filename}`,blob:p.blob})});files.unshift({name:'Photo_Register.csv',blob:new Blob(['\ufeff'+csv.join('\r\n')],{type:'text/csv'})});files.unshift({name:'README.txt',blob:new Blob([`Asset Photo Register Export\r\nAssets: ${assets.length}\r\nPhotos: ${photos.length}\r\nGenerated: ${new Date().toISOString()}\r\n`],{type:'text/plain'})});msg('Building ZIP…');let zip=await makeZip(files);dl(zip,'Asset_Photo_Register_Export.zip');msg('Export complete')}
$('#csvInput').onchange=e=>{let f=e.target.files[0];if(f)importCSV(f).catch(x=>msg(x.message));e.target.value=''};$('#cameraInput').onchange=e=>saveFiles([...e.target.files]);$('#galleryInput').onchange=e=>saveFiles([...e.target.files]);$('#closeModal').onclick=()=>$('#captureModal').style.display='none';$('#captureModal').onclick=e=>{if(e.target===$('#captureModal'))$('#captureModal').style.display='none'};$('#search').oninput=render;$('#templateBtn').onclick=()=>dl(new Blob(['Component Group,Component Name\r\nBollards,Bollard 01\r\nFenders,Fender 01\r\n'],{type:'text/csv'}),'Asset_Import_Template.csv');$('#exportBtn').onclick=()=>exportAll().catch(e=>msg('Export failed: '+e.message));$('#clearBtn').onclick=async()=>{if(confirm('Delete all imported assets and captured photos from this device?')){await clearStore('photos');await clearStore('assets');render();msg('All local data cleared')}};
openDB().then(render).catch(e=>msg('Storage error: '+e.message));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
